name: Sync docs from wiki

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown
        run: pip install markdown

      - name: Clone the wiki (canonical docs source)
        run: git clone --depth 1 https://github.com/StructuPath/herdr-browser.wiki.git wiki

      - name: Build /docs from wiki
        run: python3 scripts/build_docs.py wiki

      - name: Commit and push if changed
        run: |
          rm -rf wiki
          git add docs/
          if git diff --cached --quiet; then
            echo "Docs already in sync — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync from wiki"
            git push
          fi
